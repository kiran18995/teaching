name: Grammar Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  grammar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          curl -fsSL https://vale.sh/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Check Vale version
        run: vale --version

      - name: Run grammar check
        run: vale .
