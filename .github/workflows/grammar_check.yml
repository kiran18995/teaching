name: Grammar Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vale styles
        run: |
          mkdir -p .github/styles
          vale sync

      - name: Run Vale
        uses: errata-ai/vale-action@v2
